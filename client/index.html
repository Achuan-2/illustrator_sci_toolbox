<!DOCTYPE html>
<html>
<!-- 测试 -->

<head>
    <meta charset="utf-8">
    <title data-i18n="app.title"></title>
    <style>
        :root {
            --bg: #1f1f1f;
            --bg-panel: #262626;
            --bg-panel-2: #2d2d2d;
            --text: #eaeaea;
            --muted: #b8b8b8;
            --primary: #4ea1ff;
            --primary-600: #3188ea;
            --border: #3a3a3a;
            --danger: #ff5c5c;
            --radius: 8px;
            --radius-sm: 6px;
            --spacing: 10px;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            font-size: 13px;
            margin: 0;
        }

        /* 让根容器在 CEP 面板内可自适应宽度与高度 */
        .app {
            display: flex;
            flex-direction: row;
            height: 100%;
            min-width: 100px;
            /* 防止过窄挤压到不可用 */
        }

        /* 侧栏按标签内容确定宽度，不随当前面板的内容收缩 */
        .tabs {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-right: 1px solid var(--border);
            padding: 8px 6px;
            background: var(--bg);
            flex: 0 0 auto;
            min-width: 0;
            overflow-y: auto;
        }

        .tab {
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: all .15s ease;
            flex: 0 0 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab:hover {
            background: var(--bg-panel);
            color: var(--text);
        }

        .tab.active {
            background: var(--primary);
            color: #0d1117;
        }

        /* 内容区：填满剩余空间并允许滚动 */
        .content {
            flex: 1 1 0;
            min-width: 0;
            padding: 12px;
            overflow: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        /* 面板容器：使用 block 切换可见，但内部采用自适应布局 */
        .panel {
            display: none;
            min-width: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
        }

        .panel.active {
            display: block;
        }

        /* 关于页的长链接在内容区内换行，避免撑宽面板 */
        #panel-about {
            overflow-wrap: break-word;
        }

        .panel h3 {
            margin: 10 0 10px;
            font-size: 14px;
            color: var(--text);
        }

        .panel h4 {
            margin: 5px 0px 5px;
            font-weight: 100;
            font-size: 14px;
            color: var(--muted);
        }

        /* 表单区域改为响应式网格：根据宽度自动填充列 */
        .grid {
            display: grid;
            /* grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); */
            gap: 10px 14px;
            align-items: start;
        }

        /* 输入行：标签与控件在宽时同排，窄时换行 */
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            /* 允许在窄宽度时换行 */
        }

        label {
            color: var(--muted);
            flex-shrink: 0;
            /* 防止标签被压缩 */
            white-space: nowrap;
        }

        /* 为特定面板的标签设置宽度 */
        #panel-size .input-group>label {
            flex-basis: 75px;
        }

        /* 控件尽量占据剩余空间，避免固定像素宽度导致溢出 */
        input[type="number"],
        input[type="text"],
        select {
            flex: 1 1 100px;
            /* min-width: 80px; */
            padding: 6px 8px;
            background: var(--bg-panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            outline: none;
            width: auto;
            /* 覆盖旧的固定宽度 */
        }

        /* 颜色选择器样式 */
        input[type="color"] {
            flex: 0 0 40px;
            width: 16px;
            height: 16px;
            padding: 2px;
            background: var(--bg-panel-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: calc(var(--radius-sm) - 2px);
        }

        input[type="checkbox"] {
            transform: scale(1.1);
        }

        /* 按钮区域：自动换行并留出间距 */
        .btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-panel-2);
            color: var(--text);
            cursor: pointer;
            transition: all .15s ease;
            flex: 0 0 auto;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary-600);
            color: #0d1117;
        }

        .btn-danger {
            background: #3a2323;
            border-color: #5a2b2b;
            color: #ffcccc;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* Swap panel: two-column layout (left col: TL,BL ; right col: TR,BR) */
        .swap-grid {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .swap-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 小型辅助行：保持可换行 */
        .row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .spacer {
            height: 8px;
        }

        /* 当前面板名称：显示在内容区顶部 */
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text);
        }

        /* Label offset editing mode styles */
        .input-group input.editing-mode {
            border-color: var(--danger);
            background: rgba(255, 92, 92, 0.1);
            color: #ffcccc;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="tabs" id="tabs">
            <div class="tab active" data-target="panel-relative" data-hash="relative" data-i18n-title="tabs.relative" data-i18n="tabs.relative"></div>
            <div class="tab" data-target="panel-distribute" data-hash="distribute" data-i18n-title="tabs.distribute" data-i18n="tabs.distribute"></div>
            <div class="tab" data-target="panel-swap" data-hash="swap" data-i18n-title="tabs.swap" data-i18n="tabs.swap"></div>
            <div class="tab" data-target="panel-size" data-hash="size" data-i18n-title="tabs.size" data-i18n="tabs.size"></div>
            <div class="tab" data-target="panel-arrange" data-hash="arrange" data-i18n-title="tabs.arrange" data-i18n="tabs.arrange"></div>
            <div class="tab" data-target="panel-labels" data-hash="labels" data-i18n-title="tabs.labels" data-i18n="tabs.labels"></div>
            <div class="tab" data-target="panel-border" data-hash="border" data-i18n-title="tabs.border" data-i18n="tabs.border"></div>
            <div class="tab" data-target="panel-selection" data-hash="selection" data-i18n-title="tabs.selection" data-i18n="tabs.selection"></div>
            <div class="tab" data-target="panel-settings" data-hash="settings" data-i18n="tabs.settings" data-i18n-title="tabs.settings"></div>
            <div class="tab" data-target="panel-about" data-hash="about" data-i18n-title="tabs.about" data-i18n="tabs.about"></div>
        </div>
        <div class="content">
            <div class="panel-title" id="panel-title"></div>
            <!-- Relative Position Panel -->
            <div class="panel active" id="panel-relative">
                <div class="grid">
                    <div class="input-group">
                        <label data-i18n="relative.deltaX"></label>
                        <input type="text" id="delta-x" value="0">
                    </div>
                    <div class="input-group">
                        <label data-i18n="relative.deltaY"></label>
                        <input type="text" id="delta-y" value="0">
                    </div>
                    <div class="input-group">
                        <label data-i18n="relative.corner"></label>
                        <select id="relative-corner" style="width:120px">
                            <option value="TL" data-i18n="corners.topLeft"></option>
                            <option value="TR" data-i18n="corners.topRight"></option>
                            <option value="BL" data-i18n="corners.bottomLeft"></option>
                            <option value="BR" data-i18n="corners.bottomRight"></option>
                        </select>
                    </div>

                    <!-- New: Order options for Relative Position -->
                    <div class="input-group">
                        <label data-i18n="common.order"></label>
                        <select id="relative-order">
                            <option value="grid" selected data-i18n-title="order.gridHint" data-i18n="order.grid"></option>
                            <option value="stacking" data-i18n-title="order.stackingHint" data-i18n="order.stacking"></option>
                            <option value="horizontal" data-i18n-title="order.horizontalHint" data-i18n="order.horizontal"></option>
                            <option value="vertical" data-i18n-title="order.verticalHint" data-i18n="order.vertical"></option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label data-i18n="relative.reverse"></label>
                        <input type="checkbox" id="reverse-move-checkbox" data-i18n-title="relative.reverseHint">
                    </div>
                    <div class="input-group">
                        <label data-i18n="relative.forcePaste"></label>
                        <input type="checkbox" id="allow-mismatch-paste"
                            data-i18n-title="relative.forcePasteHint">
                    </div>
                    <div class="input-group">
                        <label data-i18n="relative.artboard"></label>
                        <input type="checkbox" id="use-artboard-ref"
                            data-i18n-title="relative.artboardHint">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn" id="copy-pos-button" data-i18n="common.copy"></button>
                    <button class="btn" id="paste-pos-button" data-i18n="common.paste"></button>
                </div>
            </div>


            <!-- Arrange Images Panel -->
            <div class="panel" id="panel-arrange">
                <div class="grid">
                    <div class="input-group">
                        <label data-i18n="arrange.auto"></label>
                        <input type="checkbox" id="auto-layout"
                            data-i18n-title="arrange.autoHint">
                    </div>
                    <div class="input-group" id="align-edges-group">
                        <label data-i18n="arrange.alignEdges"></label>
                        <input type="checkbox" id="align-edges"
                            data-i18n-title="arrange.alignEdgesHint">
                    </div>
                    <div class="input-group" id="layout-width-group" style="display:none">
                        <label data-i18n="arrange.layoutWidth"></label>
                        <input type="number" id="layout-width" value="0" min="0"
                            data-i18n-title="arrange.layoutWidthHint">
                    </div>
                    <div class="input-group" id="columns-group">
                        <label data-i18n="arrange.columns"></label>
                        <input type="number" id="columns" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <label data-i18n="arrange.rowGap"></label>
                        <input type="number" id="row-gap" value="1" min="0">
                    </div>
                    <div class="input-group" id="col-gap-group">
                        <label data-i18n="arrange.columnGap"></label>
                        <input type="number" id="col-gap" value="1" min="0">
                    </div>
                    <div class="input-group">
                        <label data-i18n="arrange.objectSize"></label>
                        <select id="arrange-size-mode">
                            <option value="original" selected data-i18n-title="arrange.originalHint" data-i18n="arrange.original"></option>
                            <option value="auto" data-i18n-title="arrange.autoSizeHint" data-i18n="arrange.autoSize"></option>
                            <option value="custom" data-i18n-title="arrange.customSizeHint" data-i18n="arrange.customSize"></option>
                        </select>
                    </div>
                    <div class="input-group" id="arrange-custom-width-group" style="display:none">
                        <label data-i18n="arrange.resizeWidth"></label>
                        <input type="number" id="uniform-width" value="100" min="0">
                        <input type="checkbox" id="use-uniform-width" checked data-i18n-title="arrange.useWidth">
                    </div>
                    <div class="input-group" id="arrange-custom-height-group" style="display:none">
                        <label data-i18n="arrange.resizeHeight"></label>
                        <input type="number" id="uniform-height" value="100" min="0">
                        <input type="checkbox" id="use-uniform-height" checked data-i18n-title="arrange.useHeight">
                    </div>

                    <!-- New: Order options for Arrange Images -->
                    <div class="input-group">
                        <label data-i18n="common.order"></label>
                        <select id="arrange-order">
                            <option value="grid" selected data-i18n-title="order.gridHint" data-i18n="order.grid"></option>
                            <option value="stacking" data-i18n-title="order.stackingHint" data-i18n="order.stacking"></option>
                            <option value="horizontal" data-i18n-title="order.horizontalHint" data-i18n="order.horizontal"></option>
                            <option value="vertical" data-i18n-title="order.verticalHint" data-i18n="order.vertical"></option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label data-i18n="common.reverseOrder"></label>
                        <input type="checkbox" id="arrange-reverse-order" data-i18n-title="common.reverseOrderHint">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn btn-primary" id="arrange-button" data-i18n="arrange.update"></button>
                </div>
            </div>

            <!-- Distribute Panel -->
            <div class="panel" id="panel-distribute">
                <h3 data-i18n="spacing.even"></h3>
                <div class="toolbar">
                    <button class="btn" id="distribute-horizontal-button" data-i18n="spacing.horizontal"></button>
                    <button class="btn" id="distribute-vertical-button" data-i18n="spacing.vertical"></button>
                </div>
                <h3 data-i18n="spacing.paste"></h3>
                <!-- Horizontal -->
                <div class="grid">
                    <div class="input-group">
                        <label data-i18n="spacing.horizontalValue"></label>
                        <input type="number" id="spacing-value-horizontal" step="0.1" value="0">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn" id="copy-spacing-horizontal-button" data-i18n="common.copy"></button>
                    <button class="btn" id="move-left-horizontal-button" data-i18n="spacing.moveLeft"></button>
                    <button class="btn" id="move-right-horizontal-button" data-i18n="spacing.moveRight"></button>
                </div>
                <!-- Vertical -->
                <div class="grid">
                    <div class="input-group">
                        <label data-i18n="spacing.verticalValue"></label>
                        <input type="number" id="spacing-value-vertical" step="0.1" value="0">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn" id="copy-spacing-vertical-button" data-i18n="common.copy"></button>
                    <button class="btn" id="move-top-vertical-button" data-i18n="spacing.moveTop"></button>
                    <button class="btn" id="move-bottom-vertical-button" data-i18n="spacing.moveBottom"></button>
                </div>
            </div>

            <!-- Swap Panel -->
            <div class="panel" id="panel-swap">
                <div class="toolbar">
                    <div class="swap-grid">
                        <div class="swap-col">
                            <button class="btn" id="swap-tl-button" data-i18n="swap.topLeft"></button>
                            <button class="btn" id="swap-bl-button" data-i18n="swap.bottomLeft"></button>
                        </div>
                        <div class="swap-col">
                            <button class="btn" id="swap-tr-button" data-i18n="swap.topRight"></button>
                            <button class="btn" id="swap-br-button" data-i18n="swap.bottomRight"></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Labels Panel -->
            <div class="panel" id="panel-labels">
                <div class="grid">
                    <div class="input-group">
                        <label data-i18n="labels.fontFamily"></label>
                        <select id="font-family">
                            <option value="ArialMT">Arial</option>
                            <option value="TimesNewRomanPSMT">Times New Roman</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.fontSize"></label>
                        <input type="number" id="font-size" value="8" min="1">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.fontBold"></label>
                        <input type="checkbox" id="font-bold" data-i18n-title="labels.fontBoldHint">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.fontColor"></label>
                        <input type="color" id="font-color" value="#000000" data-i18n-title="labels.fontColorHint">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.offsetX"></label>
                        <input type="number" id="label-offset-x" value="-6" title="">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.offsetY"></label>
                        <input type="number" id="label-offset-y" value="-6" title="">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.template"></label>
                        <select id="label-template">
                            <option value="a">a</option>
                            <option value="A">A</option>
                            <option value="(a)">(a)</option>
                            <option value="(A)">(A)</option>
                            <option value="A)">A)</option>
                            <option value="a)">a)</option>
                        </select>
                    </div>


                    <!-- New: Start Count for Labels -->
                    <div class="input-group">
                        <label data-i18n="labels.index"></label>
                        <input type="number" id="label-start-count" value="1" min="1" style="flex: 0 1 60px;">
                        <button class="btn" id="undo-label-index" data-i18n-title="labels.undoIndexHint"
                            style="flex: 0 0 auto; padding: 6px 10px;">↶</button>
                        <input type="checkbox" id="auto-update-index" checked data-i18n-title="labels.autoIndexHint">
                    </div>
                    <div class="input-group">
                        <label data-i18n="labels.preview"></label>
                        <label id="label-preview" style="color: var(--primary); font-weight: bold;">a</label>
                    </div>

                    <!-- New: Order options for Labels -->
                    <div class="input-group">
                        <label data-i18n="common.order"></label>
                        <select id="labels-order">
                            <option value="grid" selected data-i18n-title="order.gridHint" data-i18n="order.grid"></option>
                            <option value="stacking" data-i18n-title="order.stackingHint" data-i18n="order.stacking"></option>
                            <option value="horizontal" data-i18n-title="order.horizontalHint" data-i18n="order.horizontal"></option>
                            <option value="vertical" data-i18n-title="order.verticalHint" data-i18n="order.vertical"></option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label data-i18n="common.reverseOrder"></label>
                        <input type="checkbox" id="labels-reverse-order" data-i18n-title="common.reverseOrderHint">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn" id="filter-text-button" data-i18n-title="selection.textOnlyHint" data-i18n="labels.selectText"></button>
                </div>
                <div class="toolbar">
                    <button class="btn btn-primary" id="add-label-button" data-i18n-title="labels.addHint" data-i18n="labels.add"></button>
                    <button class="btn" id="update-label-button" data-i18n-title="labels.updateHint" data-i18n="labels.update"></button>
                </div>
            </div>
            <!-- Size Formater Panel -->
            <div class="panel" id="panel-size">
                <div class="grid">
                    <div class="input-group">
                        <label for="size-w" data-i18n="size.width"></label>
                        <input type="number" id="size-w" value="0" style="flex: 0 1 60px;">
                        <input type="checkbox" id="use-size-w" checked data-i18n-title="size.useWidth">
                    </div>
                    <div class="input-group">
                        <label for="size-h" data-i18n="size.height"></label>
                        <input type="number" id="size-h" value="0" style="flex: 0 1 60px;">
                        <input type="checkbox" id="use-size-h" checked data-i18n-title="size.useHeight">
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn" id="copy-size-button" data-i18n="size.copy"></button>
                    <button class="btn btn-primary" id="paste-size-button" data-i18n="size.paste"></button>
                </div>
            </div>
            <!-- Add Border Panel -->
            <div class="panel" id="panel-border">
                <div class="grid">
                    <div class="input-group">
                        <label for="border-color" data-i18n="border.color"></label>
                        <input type="color" id="border-color" value="#000000">
                    </div>
                    <div class="input-group">
                        <label for="border-thickness" data-i18n="border.thickness"></label>
                        <input type="number" id="border-thickness" value="1" min="0.1" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="border-dash" data-i18n="border.dash"></label>
                        <input type="number" id="border-dash" value="0" min="0" step="0.1"
                            data-i18n-title="border.dashHint">
                    </div>
                    <div class="input-group">
                        <label for="auto-group-border" data-i18n="border.autoGroup"></label>
                        <input type="checkbox" id="auto-group-border" checked>
                    </div>
                </div>
                <div class="toolbar">
                    <button class="btn btn-primary" id="add-border-button" data-i18n="tabs.border"></button>
                </div>
            </div>
            <!-- Selection Panel -->
            <div class="panel" id="panel-selection">
                <h3 data-i18n="selection.filter"></h3>
                <div class="toolbar">
                    <button class="btn btn-primary" id="select-text-only-button" data-i18n-title="selection.textOnlyHint" data-i18n="selection.textOnly"></button>
                    <button class="btn" id="exclude-text-button" data-i18n-title="selection.excludeTextHint" data-i18n="selection.excludeText"></button>
                </div>
            </div>
            <!-- Settings Panel -->
            <div class="panel" id="panel-settings">
                <div class="grid">
                    <div class="input-group">
                        <label for="language" data-i18n="settings.language"></label>
                        <select id="language">
                            <option value="en" selected data-i18n="settings.english"></option>
                            <option value="zh_CN" data-i18n="settings.chinese"></option>
                        </select>
                    </div>
                </div>
                <p data-i18n="settings.languageHint"></p>
            </div>
            <!-- About Panel -->
            <div class="panel" id="panel-about">
                <h3 data-i18n="about.title"></h3>
                <p data-i18n="about.author"></p>
                <p><span data-i18n="about.github"></span> <a href="https://github.com/Achuan-2/illustrator_sci_toolbox" target="_blank"
                        style="color: var(--primary); text-decoration: none;">https://github.com/Achuan-2/illustrator_sci_toolbox</a>
                </p>
                <p data-i18n="about.donation"></p>
                <img src="../icons/donate.webp" width="80%" data-i18n-alt="about.donationAlt">
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script type="text/javascript" src="i18n.js"></script>
    <script type="text/javascript" src="CSInterface.js" defer></script>
    <script type="text/javascript" src="../host/index.jsx" defer></script>

    <!-- Settings Management -->
    <script>
        // CEP插件设置管理
        var PluginSettings = {
            // 默认设置
            defaults: {
                language: "en",
                fontFamily: "ArialMT",
                fontSize: 8,
                fontBold: false,
                labelOffsetX: -6,
                labelOffsetY: -6,
                labelTemplate: "a",
                fontColor: "#000000",
                labelsOrder: "grid",
                labelsReverseOrder: false,
                autoUpdateIndex: true
            },

            // 保存设置到localStorage
            save: function () {
                try {
                    var settings = {
                        language: I18n.normalizeLanguage(document.getElementById('language').value),
                        fontFamily: document.getElementById('font-family').value,
                        fontSize: parseFloat(document.getElementById('font-size').value),
                        fontBold: document.getElementById('font-bold').checked,
                        labelOffsetX: parseFloat(document.getElementById('label-offset-x').value),
                        labelOffsetY: parseFloat(document.getElementById('label-offset-y').value),
                        labelTemplate: document.getElementById('label-template').value,
                        fontColor: document.getElementById('font-color').value,
                        labelsOrder: document.getElementById('labels-order').value,
                        labelsReverseOrder: document.getElementById('labels-reverse-order').checked,
                        autoUpdateIndex: document.getElementById('auto-update-index').checked
                    };
                    localStorage.setItem('illustrator_sci_plugin_settings', JSON.stringify(settings));
                } catch (e) {
                    console.log('Failed to save settings:', e);
                }
            },

            // 从localStorage加载设置
            load: function () {
                try {
                    var saved = localStorage.getItem('illustrator_sci_plugin_settings');
                    if (saved) {
                        var settings = JSON.parse(saved);

                        // 应用保存的设置
                        I18n.setLanguage(settings.language || this.defaults.language);
                        document.getElementById('font-family').value = settings.fontFamily || this.defaults.fontFamily;
                        document.getElementById('font-size').value = settings.fontSize || this.defaults.fontSize;
                        document.getElementById('font-bold').checked = settings.fontBold !== undefined ? settings.fontBold : this.defaults.fontBold;
                        document.getElementById('label-offset-x').value = settings.labelOffsetX || this.defaults.labelOffsetX;
                        document.getElementById('label-offset-y').value = settings.labelOffsetY || this.defaults.labelOffsetY;
                        document.getElementById('label-template').value = settings.labelTemplate || this.defaults.labelTemplate;
                        document.getElementById('font-color').value = settings.fontColor || this.defaults.fontColor;
                        document.getElementById('labels-order').value = settings.labelsOrder || this.defaults.labelsOrder;
                        document.getElementById('labels-reverse-order').checked = settings.labelsReverseOrder || this.defaults.labelsReverseOrder;
                        document.getElementById('auto-update-index').checked = settings.autoUpdateIndex !== undefined ? settings.autoUpdateIndex : this.defaults.autoUpdateIndex;

                        console.log('Settings loaded successfully');
                    } else {
                        I18n.setLanguage(this.defaults.language);
                    }
                } catch (e) {
                    console.log('Failed to load settings:', e);
                    this.applyDefaults();
                }
            },

            // 应用默认设置
            applyDefaults: function () {
                I18n.setLanguage(this.defaults.language);
                document.getElementById('font-family').value = this.defaults.fontFamily;
                document.getElementById('font-size').value = this.defaults.fontSize;
                document.getElementById('font-bold').checked = this.defaults.fontBold;
                document.getElementById('label-offset-x').value = this.defaults.labelOffsetX;
                document.getElementById('label-offset-y').value = this.defaults.labelOffsetY;
                document.getElementById('label-template').value = this.defaults.labelTemplate;
                document.getElementById('font-color').value = this.defaults.fontColor;
                document.getElementById('labels-order').value = this.defaults.labelsOrder;
                document.getElementById('labels-reverse-order').checked = this.defaults.labelsReverseOrder;
                document.getElementById('auto-update-index').checked = this.defaults.autoUpdateIndex;
            },

            // 初始化设置管理
            init: function () {
                var self = this;

                // Restore the language before the deferred host handlers initialize.
                // Other settings retain their existing load-time initialization.
                try {
                    var saved = JSON.parse(localStorage.getItem('illustrator_sci_plugin_settings') || '{}');
                    I18n.setLanguage(saved.language || self.defaults.language);
                } catch (e) {
                    I18n.setLanguage(self.defaults.language);
                }

                document.getElementById('language').addEventListener('change', function () {
                    I18n.setLanguage(this.value);
                    // Save immediately so closing the panel also retains the selection.
                    clearTimeout(self.saveTimeout);
                    self.save();
                });

                // 页面加载时恢复设置
                window.addEventListener('load', function () {
                    self.load();
                    // 如果updateLabelPreview函数存在，则更新预览
                    if (typeof updateLabelPreview === 'function') {
                        updateLabelPreview();
                    }
                });

                // 添加设置变化监听器
                var settingsInputs = [
                    'font-family', 'font-size', 'font-bold', 'label-offset-x', 'label-offset-y',
                    'label-template', 'font-color',
                    'labels-order', 'labels-reverse-order', 'auto-update-index'
                ];

                settingsInputs.forEach(function (id) {
                    var element = document.getElementById(id);
                    if (element) {
                        var eventType = (element.type === 'checkbox' || element.tagName === 'SELECT') ? 'change' : 'input';
                        element.addEventListener(eventType, function () {
                            // 延迟保存，避免频繁写入
                            clearTimeout(self.saveTimeout);
                            self.saveTimeout = setTimeout(function () {
                                self.save();
                            }, 500);
                        });
                    }
                });

                // 窗口关闭时保存设置
                window.addEventListener('beforeunload', function () {
                    self.save();
                });
            }
        };

        // 初始化设置管理
        PluginSettings.init();
    </script>

    <!-- Arrange 面板选项联动显隐 -->
    <script>
        (function () {
            function updateArrangeVisibility() {
                var auto = document.getElementById('auto-layout').checked;
                var align = document.getElementById('align-edges').checked;
                var sizeModeEl = document.getElementById('arrange-size-mode');
                var sizeMode = sizeModeEl ? sizeModeEl.value : 'original';

                // 勾选 Auto Layout：隐藏 Columns 控件
                document.getElementById('columns-group').style.display = auto ? 'none' : '';
                // 勾选 Align Edges：
                // 如果对象大小为 Auto（自动调整），则允许自定义列间距（通过等比缩放填满对齐宽度）；
                // 否则（非 Auto 模式），列间距由对象原始尺寸自动均分计算，因此隐藏
                if (align) {
                    document.getElementById('col-gap-group').style.display = sizeMode === 'auto' ? '' : 'none';
                    document.getElementById('layout-width-group').style.display = '';
                } else {
                    document.getElementById('col-gap-group').style.display = '';
                    document.getElementById('layout-width-group').style.display = 'none';
                }

                // Object Size 选项联动：仅在 custom 时显示自定义宽度/高度输入框
                var customWidthGroup = document.getElementById('arrange-custom-width-group');
                var customHeightGroup = document.getElementById('arrange-custom-height-group');
                if (customWidthGroup) customWidthGroup.style.display = sizeMode === 'custom' ? '' : 'none';
                if (customHeightGroup) customHeightGroup.style.display = sizeMode === 'custom' ? '' : 'none';
            }
            ['auto-layout', 'align-edges', 'arrange-size-mode'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('change', updateArrangeVisibility);
            });
            window.addEventListener('load', updateArrangeVisibility);
            // 立即调用一次以初始化初始视图
            updateArrangeVisibility();
        })();
    </script>

    <!-- Tabs logic: keep ids intact for existing scripts -->
    <script>
        (function () {
            const tabs = document.querySelectorAll('.tab');
            const panels = document.querySelectorAll('.panel');
            const titleEl = document.getElementById('panel-title');

            function activate(hash) {
                let target = 'panel-relative';
                if (hash === 'arrange') target = 'panel-arrange';
                else if (hash === 'distribute') target = 'panel-distribute';
                else if (hash === 'labels') target = 'panel-labels';
                else if (hash === 'size') target = 'panel-size';
                else if (hash === 'border') target = 'panel-border';
                else if (hash === 'swap') target = 'panel-swap';
                else if (hash === 'selection') target = 'panel-selection';
                else if (hash === 'settings') target = 'panel-settings';
                else if (hash === 'about') target = 'panel-about';

                tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
                panels.forEach(p => p.classList.toggle('active', p.id === target));

                // 内容区顶部显示当前 Tab 名称
                const activeTab = document.querySelector(`.tab[data-target="${target}"]`);
                if (titleEl && activeTab) titleEl.textContent = activeTab.textContent;
            }

            function readHash() {
                const h = (location.hash || '').replace('#', '');
                if (h) activate(h);
            }

            tabs.forEach(t => {
                t.addEventListener('click', () => {
                    const hash = t.dataset.hash;
                    // update URL hash (non-breaking for CEP)
                    try { location.hash = hash; } catch (e) { }
                    activate(hash);
                });
            });

            window.addEventListener('hashchange', readHash);
            // init
            readHash();
        })();
    </script>
